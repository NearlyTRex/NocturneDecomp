# Blair Witch Volume II: The Legend of Coffin Rock, on the Nocturne engine. Only what is known
# so far: the rest (menu layout, loading screens, stories) comes from analysing its binary.
# Startup stops at the first front-end part this build doesn't have.

title = "Blair Witch Volume II"

# A loop of title frames; a bar across the top while a level loads; credits that fade in and out
# about the screen's middle and loop; START begins its one story
[front_end]
title_backdrop = "flipbook"
loading_indicator = "progress_bar"
credits = "fade_loop"
story_select = "direct_start"
