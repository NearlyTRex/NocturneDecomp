# What Blair Witch Volume II: The Legend of Coffin Rock's binary hard-coded about its own game, on
# the Nocturne engine. Where a value is Nocturne's, BW2 kept it. What BW2 does that no key says yet
# is listed in research/29-blair_witch_engine_changes/front-end-schema.md.

title = "Blair Witch Volume II"

# The title's frames alone over a fixed camera; a bar across the top while a level loads; credits
# that fade in and out about the screen's middle and loop; START begins its one story
[front_end]
title_backdrop = "figure_scene"
loading_indicator = "progress_bar"
credits = "fade_loop"
story_select = "direct_start"

# BW1's scene without its backdrop or figures: the title's 75 frames over the top of the cleared
# screen, 12 a second, wrapping at 74 (head-of-horror code 666 is only cleared)
[title_backdrop.figure_scene]
cheat_code = 666
camera_rotation = [0.441335, 0.660356, -0.60758,
                   -0.279881, 0.74461, 0.605989,
                   0.852579, -0.097394, 0.513443]
camera_origin = [3.16143, 7.6283, -7.03622]
projection = 43.153214
light = [-37000, -37000, 37000]
flat = [50000, 50000, 0x10000]
ambient = 0x1964
frame_prefix = "blairwitch_"
frame_digits = 2
frame_count = 75
frame_x = 0
frame_y = 0
frame_width = 640
frame_height = 282
frame_alpha = 0xffff
frame_rate = 12
frame_wrap = 74

# title_bw at 10,7; every line centred and faded by its distance from the middle, 32 pixels a
# second up from the foot, starting again from 500 once past -2500, until the music ends
[credits]
text = "credits.txt"
image = "title_bw"
music = "XBLAIRMENU.WAV"

[credits.fade_loop]
font = "theme"
image_x = 10
image_y = 7
text_colour = 0xf8
heading_colour = 0x02
shadow_colour = 0
scroll_speed = 32
start_y = 480
loop_below = -2500
restart_y = 500
fade_centre = 240
fade_reach = 240
end_line = "end"
marker = "\\"
heading = "b"

# test_logo opaque; BW2 measured "Loading..." and never drew it, as Nocturne did
[startup]
picture = "test_logo"
picture_alpha = 0xffff
label_x = 320
label_y = 240
label_font = "theme"
label_colour = 0xf8
movie_directory = "video"
movie = "opening.avi"

# Every line centred, with a copy one pixel under it in colour 4 (the title's one right and down
# in colour 2); the main menu at 310, every titled page at 290. No trademark or copyright.
[menu]
left = 160
align = "centre"
top = 310
titled_top = 290

[menu.title]
colour = 0xfa
shadow = 0
gap_lines = 1
drop = { x = 1, y = 1, colour = 0x02 }

# Opaque, the selected item brighter, with no glow
[menu.item]
font = "theme"
colour = 0xfc
selected_colour = 0xff
alpha = 0xffff
shadow = -1
spacing_titled = 1
spacing_untitled = 2
drop = { x = 0, y = 1, colour = 0x04 }

[menu.item.glow]
colour = 0xff
copies = 0
flicker = false

# BW2 drew "1.2" at the top right; the recreation's build line is drawn there
[menu.footer]
font = "small_editor"
colour = 0xfa
shadow = 0
version_x = 0
version_alpha = 0xffff
version_corner = "top_right"

# XBLAIRMENU.wav at either rate
[menu.music]
low_rate = "XBLAIRMENU.wav"
high_rate = "XBLAIRMENU.wav"

[menu.calibration]
image = "brightness"
steps = [
    "1. Turn off all the lights in your room.",
    "2. Turn your brightness up, so that you see 3 bars on the left side of the screen.",
    "3. Turn down the brightness, so that the left 2 bars become the same color.",
    "4. Turn your contrast all the way up.",
    "You're done with calibration.",
]
title = "Monitor calibration"
prompt = "  Press any key to continue."
font = "small_editor"
colour = 0xf8
title_lines = 2
prompt_lines = 3

[menu.options]
hero = 9

[menu.sound]
effects_sample = "colt45-0.wav"

# The right half's bars run backwards, mirrored about the middle
[menu.sound.spectrum]
frames = ["F0100.RAW", "F0300.RAW", "F0500.RAW", "F0700.RAW",
          "F0900.RAW", "F1100.RAW", "F1300.RAW", "F1500.RAW"]
fps = 24
pitch = 4
half_width = 16
margin_divisor = 20
height_percent = 25
alpha = 0x8000
mirrored = true

[menu.slider]
width_share = 3
width_parts = 4
height = 0x2c
bar_colour = 0x04
trough_colour = 0x00
border_colour = 0xff
text_colour = 0xff
text_shadow = 0

[menu.features]
difficulty = false

# No mode aims by hand. Infrared, map, jump and the fourth and fifth weapons start unbound.
[[controls.mode]]
id = "keyboard"
label = "Control : Keyboard"
manual_aim = false
[controls.mode.defaults]
walk = [0x11]  # DIK_W
backup = [0x1f]  # DIK_S
run = [0x2a]  # DIK_LSHIFT
strafe = [0x38]  # DIK_LMENU
strafe_left = [0x1e]  # DIK_A
strafe_right = [0x20]  # DIK_D
right = [0x14d]  # DIK_RIGHT
left = [0x14b]  # DIK_LEFT
fire = [0x1d]  # DIK_LCONTROL
use_item = [0x1c]  # DIK_RETURN
light = [0x10]  # DIK_Q
infrared = []
draw = [0x21]  # DIK_F
jump = []
point_up = [0x148]  # DIK_UP
point_down = [0x150]  # DIK_DOWN
weapon1 = [0x2]  # DIK_1
weapon2 = [0x3]  # DIK_2
weapon3 = [0x4]  # DIK_3
weapon4 = []
weapon5 = []
next_weapon = [0xd]  # DIK_EQUALS
prev_weapon = [0xc]  # DIK_MINUS
next_item = [0x1a]  # DIK_LBRACKET
prev_item = [0x1b]  # DIK_RBRACKET
item_desc = [0x19]  # DIK_P
next_ammo = [0x29]  # DIK_GRAVE
map = []

[[controls.mode]]
id = "keyboard_mouse"
label = "Control : Keyboard/Mouse"
manual_aim = false
[controls.mode.defaults]
walk = [0x11]  # DIK_W
backup = [0x1f]  # DIK_S
run = [0x2a]  # DIK_LSHIFT
strafe = [0x38]  # DIK_LMENU
strafe_left = [0x1e]  # DIK_A
strafe_right = [0x20]  # DIK_D
right = [0x255]  # DIM_XAXIS
left = [0x255]  # DIM_XAXIS
fire = [0x200]  # DIM_LBUTTON
use_item = [0x1c]  # DIK_RETURN
light = [0x10]  # DIK_Q
infrared = []
draw = [0x201]  # DIM_RBUTTON
jump = []
point_up = [0x256]  # DIM_YAXIS
point_down = [0x256]  # DIM_YAXIS
weapon1 = [0x2]  # DIK_1
weapon2 = [0x3]  # DIK_2
weapon3 = [0x4]  # DIK_3
weapon4 = []
weapon5 = []
next_weapon = [0xd]  # DIK_EQUALS
prev_weapon = [0xc]  # DIK_MINUS
next_item = [0x1a]  # DIK_LBRACKET
prev_item = [0x1b]  # DIK_RBRACKET
item_desc = [0x19]  # DIK_P
next_ammo = [0x29]  # DIK_GRAVE
map = []

# The enhanced game's pad, as Nocturne's; BW2's own joystick buttons are codes no pad sends
[[controls.mode]]
id = "gamepad"
label = "Control : Gamepad"
manual_aim = false
[controls.mode.defaults]
walk = [0x253]  # DIJ_UP
backup = [0x254]  # DIJ_DOWN
run = [0x167]  # PAD_LEFTSTICK
strafe = []
strafe_left = [0x251]  # DIJ_LEFT
strafe_right = [0x252]  # DIJ_RIGHT
right = [0x17f]  # PAD_RSTICK_RIGHT
left = [0x17e]  # PAD_RSTICK_LEFT
fire = [0x17b]  # PAD_RTRIGGER
use_item = [0x161]  # PAD_B
light = [0x162]  # PAD_X
infrared = [0x163]  # PAD_Y
draw = [0x17a]  # PAD_LTRIGGER
jump = [0x160]  # PAD_A
point_up = [0x17c]  # PAD_RSTICK_UP
point_down = [0x17d]  # PAD_RSTICK_DOWN
weapon1 = []
weapon2 = []
weapon3 = []
weapon4 = []
weapon5 = [0x16c]  # PAD_DPAD_DOWN
next_weapon = [0x16a]  # PAD_RIGHTSHOULDER
prev_weapon = [0x169]  # PAD_LEFTSHOULDER
next_item = [0x16e]  # PAD_DPAD_RIGHT
prev_item = [0x16d]  # PAD_DPAD_LEFT
item_desc = [0x165]  # PAD_GUIDE
next_ammo = [0x16b]  # PAD_DPAD_UP
map = [0x164]  # PAD_BACK

