# One picture for every level
[[loading]]
id = "loadscreen"

# Ten loading frames before the story's one mission
[story_select.direct_start]
loading_frames = 10

# The story's year: the binary's 1941 (0x795) is BW1's, left in its table, and never shown, as
# BW2 shows no chapter title
[[story]]
id = "coffin_rock"
name = "Coffin Rock"
title = "Coffin Rock"
year = 1886
loading = "loadscreen"

[[story.chapter]]
name = "Coffin Rock"
mission = "awakening.msn"
