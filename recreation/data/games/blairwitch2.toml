# Nocturne's six fonts, unchanged; BW2's seventh, dochand.raw, nothing draws yet
[[font]]
id = "medium"
file = "nocfont.raw"
width = 0x136
height = 0x1ae
transparent = 0x00
own_colours = false
y_offsets = [{ offset = 3, first = 0x20, last = 0x7e }, { offset = 1, first = 0xc0, last = 0xdf }]
space_width = 8
shadow_x = 2
os_font = { height = 14, y_offset1 = 2, y_offset2 = 2 }

[[font]]
id = "tiny"
file = "nocsmall.raw"
width = 0xf8
height = 0x158
transparent = 0x00
own_colours = false
y_offsets = [{ offset = 2, first = 0x20, last = 0x7e }]
space_width = 5
shadow_x = 2
os_font = { height = 12, y_offset1 = 0, y_offset2 = 0 }

[[font]]
