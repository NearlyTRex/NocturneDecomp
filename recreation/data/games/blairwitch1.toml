# The story, then a difficulty under its title; Cancel goes back to the story. The binary also
# probes blairhero.pod, whose answer nothing uses, so every install is whole.
[story_select.story_list]
full_install_probe = "blairhero.pod"
loading_frames = 10

[[story_select.story_list.difficulty]]
label = "Normal Puzzles, Normal Combat"
