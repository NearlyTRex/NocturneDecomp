# What Nocturne's binary hard-coded about its own game. A base manifest written for one of its
# releases copies this, so the game reads it from the install like any package's.

title = "Nocturne"
front_end = "nocturne"
loading_indicator = "moon"
copyright = "Nocturne 1999 Terminal Reality Inc.  Patent Pending."
copyright_os_font = "Nocturne (c) 1999 Terminal Reality Inc.  Patent Pending."

[credits]
text = "credits.txt"
image = "stats"
music = "faded-remix.mp3"

# The main menu's top, and the highest title any shipped screen draws, Sound Options', which
# clears the logo.
[menu]
left = 160
top = 250
titled_top = 225
trademark = { x = 518, y = 99 }

[[loading]]
id = "load1"
moon = { x = 120, y = 130, tint = [0x8200, 0xc800, 0xf400] }
random = true

