# No mode aims by hand. Fire and Jump are both Space. BW3's Action, Journal, Compass, Voodoo Doll
# and Quick turn are its own actions.
[[controls.mode]]
id = "keyboard"
label = "Control : Keyboard"
manual_aim = false
[controls.mode.defaults]
walk = [0x148]  # DIK_UP
backup = [0x150]  # DIK_DOWN
run = [0x2a]  # DIK_LSHIFT
strafe = [0x38]  # DIK_LMENU
strafe_left = [0x2c]  # DIK_Z
strafe_right = [0x2d]  # DIK_X
right = [0x14d]  # DIK_RIGHT
left = [0x14b]  # DIK_LEFT
fire = [0x39]  # DIK_SPACE
use_item = [0x1c]  # DIK_RETURN
light = [0x26]  # DIK_L
infrared = [0x31]  # DIK_N
draw = [0x20]  # DIK_D
jump = [0x39]  # DIK_SPACE
point_up = [0x10]  # DIK_Q
point_down = [0x1e]  # DIK_A
weapon1 = [0x2]  # DIK_1
weapon2 = [0x3]  # DIK_2
weapon3 = [0x4]  # DIK_3
weapon4 = [0x5]  # DIK_4
weapon5 = [0x6]  # DIK_5
next_weapon = [0xd]  # DIK_EQUALS
prev_weapon = [0xc]  # DIK_MINUS
next_item = [0x1a]  # DIK_LBRACKET
prev_item = [0x1b]  # DIK_RBRACKET
item_desc = [0x19]  # DIK_P
next_ammo = [0x29]  # DIK_GRAVE
map = [0xf]  # DIK_TAB

