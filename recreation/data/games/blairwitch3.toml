# What Blair Witch Volume III: The Elly Kedward Tale's binary hard-coded about its own game, on the
# Nocturne engine. Where a value is Nocturne's, BW3 kept it. What BW3 does that no key says yet is
# listed in research/29-blair_witch_engine_changes/front-end-schema.md.

title = "Blair Witch Volume III"
# BW3's line ended ", Ver %1.2f" with no number given it; the recreation's build line is its own
copyright = "Blair Witch Volume III: The Elly Kedward Tale (c) 2000 Ritual Entertainment"

# A tiled scrolling backdrop with a fading hand; an icon for each loading picture; credits in two
# columns between letterbox bars; START begins its one story
[front_end]
title_backdrop = "tiled_scroll"
loading_indicator = "icon"
credits = "two_column"
story_select = "direct_start"

# bwp3_menu_scroll tiled two by two, two pixels right and one up each drawing; bwp3_hand at 64,64
# fading from opaque to 5000 and back, 500 a drawing; BWP3_mainmenu over them
[title_backdrop.tiled_scroll]
# "stretch" fills a wide screen, the hand and overlay stretching with the tiles
fit = "keep_aspect"
tile = "bwp3_menu_scroll"
columns = [320, -320]
rows = [0, 480]
step_x = 2
step_y = -1
# The tiles' and the hand's steps a second, moved smoothly between; BW3 stepped once a drawing,
# at whatever frame rate
steps_per_second = 60
wrap_x_above = 639
wrap_x_to = -640
wrap_y_below = -479
wrap_y_to = 479
hand = "bwp3_hand"
hand_x = 64
hand_y = 64
hand_width = 512
hand_height = 512
hand_alpha_start = 0x10000
hand_alpha_low = 5000
hand_alpha_high = 0xffff
hand_alpha_step = 500
overlay = "BWP3_mainmenu"

# No image or music of their own; a line centred between 100 and 400, or "\1left\2right" at 100
# and 300; black bars over the top 31 and the bottom 41 rows; again from 480 once all are gone
[credits]
text = "credits.txt"
fit = "keep_aspect"

[credits.two_column]
font = "theme"
centre_left = 100
centre_right = 400
left_x = 100
right_x = 300
left_column = "1"
right_column = "2"
top_strip_bottom = 30
bottom_strip_top = 439
strip_colour = 0x00
text_colour = 0xf8
heading_colour = 0x02
shadow_colour = 0
scroll_speed = 32
start_y = 480
end_line = "end"
marker = "\\"
heading = "b"

[startup]
picture = "fangs"
fit = "keep_aspect"
picture_alpha = 0x8000
label_x = 320
label_y = 240
label_font = "theme"
label_colour = 0xf8
movie_directory = "video"
movie = "opening.avi"

# Titles in BW3's menu font at 175, two lines over their pages' lines in its smaller one, every
# titled page at 200; the main menu's four lines in the menu font, each on its own row
[menu]
left = 175
top = 200
titled_top = 200

[menu.title]
colour = 0x9a
shadow = 0
gap_lines = 2
font = "menu"

# The glow never stops, its copies 0xab over the line's own 0x9a
[menu.item]
font = "small_menu"
untitled_font = "menu"
# BW3 put START at 284, OPTIONS at 269, LOAD at 290 and QUIT at 292, each its word's middle at
# about 320; the recreation's own words are centred there, on BW3's rows
untitled_positions = [{ centre_x = 320, y = 234 }, { centre_x = 320, y = 274 },
                      { centre_x = 320, y = 314 }, { centre_x = 320, y = 354 }]
colour = 0x9a
selected_colour = 0x9a
alpha = 48000
shadow = -1
spacing_titled = 1
spacing_untitled = 2

[menu.item.glow]
colour = 0xab
copies = 5
flicker = true
item_colour = 0x9a

[menu.footer]
font = "small_editor"
colour = 0xf8
shadow = 0
version_alpha = 0x8000

# The copyright ends at 619 on the title backdrop, keeping its shape or stretched as it does
[menu.footer.copyright]
corner = "bottom_right"
edge = "backdrop"
x = 21
y = 1

# BW3's version was in its copyright, with no number; the recreation's build line is drawn where
# Nocturne's was, in the backdrop's corner
[menu.footer.version]
corner = "bottom_left"
edge = "backdrop"
x = 4
y = 1

# The 22kHz splash music, or splash.mp3
[menu.music]
low_rate = "splash-music-22.wav"
high_rate = "splash.mp3"

[menu.calibration]
image = "brightness"
fit = "stretch"
steps = [
    "1. Turn off all the lights in your room.",
    "2. Turn your brightness up, so that you see 3 bars on the left side of the screen.",
    "3. Turn down the brightness, so that the left 2 bars become the same color.",
    "4. Turn your contrast all the way up.",
    "You're done with calibration.",
]
title = "Monitor calibration"
prompt = "  Press any key to continue."
font = "small_editor"
colour = 0xf8
title_lines = 2
prompt_lines = 3

[menu.options]
hero = 9
card_name_length = 24

# No flame bars
[menu.sound]
effects_sample = "colt45-0.wav"

[menu.slider]
width_share = 3
width_parts = 4
height = 0x2c
bar_colour = 0x04
trough_colour = 0x00
border_colour = 0xff
text_colour = 0xff
text_shadow = 0

[menu.features]
difficulty = false

