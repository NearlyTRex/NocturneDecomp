# The releases of the game this build recognises, by the PODs each shipped: name, size in bytes
# and XXH3-128 as canonical hex. Without a base manifest the game finds the release its install
# matches best and writes one from it, recording the release's id. Each release is a [[release]]
# with an id of its own: year, language and game, then anything more (1999-de-nocturne,
# 2000-en-nocturne-budget), never changed once published. game names the data/games/ file whose content the manifest is written with, and
# required the PODs the game can't start without. [[release.file]] lists everything else a fresh
# install had (executable, DLLs, loose data) by its '/'-separated path.
# scripts/Python/catalog_release.py prints a new release's entry from its install folder.

