<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <style>
    .title { font: bold 16px sans-serif; }
    .label { font: 12px sans-serif; fill: #333; }
    .small-label { font: 10px sans-serif; fill: #666; }
    .percent { font: bold 14px sans-serif; fill: #333; }
    .small-percent { font: bold 11px sans-serif; fill: #333; }
    .summary { font: 11px sans-serif; fill: #666; }
  </style>
  <rect width="100%%" height="100%%" fill="white"/>
  <text x="300" y="25" class="title" text-anchor="middle">Decompilation Progress</text>
  <text x="110" y="70" class="label" text-anchor="end">Complete</text>
  <rect x="120" y="50" width="450" height="30" fill="#E0E0E0" rx="4"/>
  <rect x="120" y="50" width="98" height="30" fill="#2E7D32" rx="4"/>
  <text x="580" y="70" class="percent">21.8% (1558/7154)</text>
  <text x="110" y="117" class="small-label" text-anchor="end">Decompiled</text>
  <rect x="120" y="105" width="450" height="16" fill="#E0E0E0" rx="3"/>
  <rect x="120" y="105" width="160" height="16" fill="#4CAF50" rx="3"/>
  <text x="580" y="117" class="small-percent">35.6%</text>
  <text x="110" y="141" class="small-label" text-anchor="end">Compiles</text>
  <rect x="120" y="129" width="450" height="16" fill="#E0E0E0" rx="3"/>
  <rect x="120" y="129" width="136" height="16" fill="#2196F3" rx="3"/>
  <text x="580" y="141" class="small-percent">30.2%</text>
  <text x="300" y="185" class="summary" text-anchor="middle">
    7154 functions total | 2546 clean | 2163 compile | 1558 fully complete
  </text>
</svg>