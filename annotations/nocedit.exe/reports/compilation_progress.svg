    .bar-label { font: bold 11px sans-serif; fill: white; }
    .bar-label-dark { font: bold 11px sans-serif; fill: #333; }
    .count { font: bold 12px sans-serif; fill: #333; }
    .summary { font: 12px sans-serif; fill: #666; }
  </style>
  <rect width="100%%" height="100%%" fill="white"/>
  <text x="350" y="30" class="title" text-anchor="middle">Function Compilation Status</text>
  <text x="150" y="60" class="subtitle" text-anchor="middle">Results</text>
  <path d="M 150,180 L 150.00,80.00 A 100,100 0 1,1 149.81,80.00 Z" fill="#4CAF50" stroke="white" stroke-width="2"/>
  <path d="M 150,180 L 149.81,80.00 A 100,100 0 0,1 150.00,80.00 Z" fill="#F44336" stroke="white" stroke-width="2"/>
  <rect x="80" y="300" width="14" height="14" fill="#4CAF50" rx="2"/>
  <text x="100" y="311" class="label">Successful: 6452 (100.0%)</text>
  <rect x="80" y="324" width="14" height="14" fill="#F44336" rx="2"/>
  <text x="100" y="335" class="label">Failed: 2 (0.0%)</text>
  <text x="320" y="60" class="subtitle">Error Categories</text>
  <rect x="320" y="70" width="280" height="32" fill="#EEEEEE" rx="4"/>
  <rect x="320" y="70" width="280" height="32" fill="#E53935" rx="4"/>
  <text x="328" y="90" class="bar-label">Type Error</text>
  <text x="650" y="90" class="count" text-anchor="end">7</text>
  <rect x="320" y="114" width="280" height="32" fill="#EEEEEE" rx="4"/>
  <rect x="320" y="114" width="80" height="32" fill="#FB8C00" rx="4"/>
  <text x="408" y="134" class="bar-label-dark">Undeclared Identifier</text>
  <text x="650" y="134" class="count" text-anchor="end">2</text>
  <text x="350" y="455" class="summary" text-anchor="middle">
    6,454 functions total | 6,452 successful | 100.0% success rate
  </text>
