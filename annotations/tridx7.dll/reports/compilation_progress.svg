  <rect x="320" y="114" width="280" height="32" fill="#EEEEEE" rx="4"/>
  <rect x="320" y="114" width="160" height="32" fill="#FB8C00" rx="4"/>
  <text x="328" y="134" class="bar-label">Undeclared Identifier</text>
