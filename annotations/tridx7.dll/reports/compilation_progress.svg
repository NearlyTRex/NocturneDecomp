  <rect x="320" y="158" width="280" height="32" fill="#EEEEEE" rx="4"/>
  <rect x="320" y="158" width="56" height="32" fill="#FDD835" rx="4"/>
  <text x="384" y="178" class="bar-label-dark">Syntax Error</text>
  <text x="650" y="178" class="count" text-anchor="end">55</text>
  <rect x="320" y="202" width="280" height="32" fill="#EEEEEE" rx="4"/>
  <rect x="320" y="202" width="48" height="32" fill="#43A047" rx="4"/>
  <text x="376" y="222" class="bar-label-dark">Incompatible Types</text>
  <text x="650" y="222" class="count" text-anchor="end">47</text>
  <rect x="320" y="246" width="280" height="32" fill="#EEEEEE" rx="4"/>
  <rect x="320" y="246" width="6" height="32" fill="#1E88E5" rx="4"/>
