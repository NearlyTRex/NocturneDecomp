<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="480" viewBox="0 0 700 480">
  <style>
    .title { font: bold 18px sans-serif; }
    .subtitle { font: bold 13px sans-serif; fill: #444; }
    .label { font: 12px sans-serif; }
    .bar-label { font: bold 11px sans-serif; fill: white; }
    .bar-label-dark { font: bold 11px sans-serif; fill: #333; }
    .count { font: bold 12px sans-serif; fill: #333; }
    .summary { font: 12px sans-serif; fill: #666; }
  </style>
  <rect width="100%%" height="100%%" fill="white"/>
  <text x="350" y="30" class="title" text-anchor="middle">Function Compilation Status</text>
  <text x="150" y="60" class="subtitle" text-anchor="middle">Results</text>
  <circle cx="150" cy="180" r="100" fill="#F44336" stroke="white" stroke-width="2"/>
  <rect x="80" y="324" width="14" height="14" fill="#F44336" rx="2"/>
  <text x="100" y="335" class="label">Failed: 74 (100.0%)</text>
  <text x="320" y="60" class="subtitle">Error Categories</text>
  <rect x="320" y="70" width="280" height="32" fill="#EEEEEE" rx="4"/>
  <rect x="320" y="70" width="280" height="32" fill="#E53935" rx="4"/>
  <text x="328" y="90" class="bar-label">Missing Header</text>
  <text x="650" y="90" class="count" text-anchor="end">74</text>
  <text x="350" y="455" class="summary" text-anchor="middle">
    74 functions total | 0 successful | 0.0% success rate
  </text>
</svg>