<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="480" viewBox="0 0 700 480">
  <style>
    .title { font: bold 18px sans-serif; }
    .subtitle { font: bold 13px sans-serif; fill: #444; }
