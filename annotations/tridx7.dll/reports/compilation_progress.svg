    .bar-label-dark { font: bold 11px sans-serif; fill: #333; }
    .count { font: bold 12px sans-serif; fill: #333; }
    .summary { font: 12px sans-serif; fill: #666; }
  </style>
  <rect width="100%%" height="100%%" fill="white"/>
