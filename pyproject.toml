[tool.coverage.report]
skip_covered = true

[tool.ruff]
# research/ holds the scripts behind its write-ups, kept as they were run
extend-exclude = ["research", "build", "headers"]

[tool.ruff.lint]
# The Workflows library's default set, pinned here so a library change is a
# deliberate change in this repo
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Not yet cleaned up; mirrors [tool.coverage.run] omit, and shrinks with it
