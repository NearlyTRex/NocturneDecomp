# The Python tooling: the Ghidra scripts and standalone tools in scripts/Python,
# plus cmake/collect_sources.py and recreation/cmake/tidy.py. Nothing here is a
# package; the project table exists because CI installs the checkout with
# `pip install -e .` before running the tests. The release version lives in
# CMakeLists.txt.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nocturne-decomp-tools"
version = "0"
requires-python = ">=3.12"

[tool.setuptools]
packages = []

[tool.testrex]
# The meta suite and the hermetic seal, from pytest-testrex; see tests/README.md
tests_dir = "tests"
min_test_files = 1
# integration/ joins when the first test against a real headless Ghidra lands
suites = ["unit"]
integration_suites = []
pylint_rcfile = "tests/pylintrc"
# Run the Ghidra scripts against a real headless Ghidra; see tests/conftest.py
requirement_markers = ["requires_ghidra"]
# Raise privileges, reach another machine, or publish
sealed_programs = [
    "sudo", "su", "pkexec", "doas",
    "ssh", "scp", "sftp",
    "gh",
]

[tool.coverage.run]
branch = true
source = ["scripts/Python", "cmake", "recreation/cmake"]
# The tests run in pytest-xdist workers, each writing its own data file
parallel = true
patch = ["subprocess"]
# Not yet covered. Each file leaves this list when its tests land, and the same
# file leaves [tool.ruff.lint.per-file-ignores] with it; the meta suite checks the
# two lists agree. The list only shrinks.
omit = [
    "recreation/cmake/tidy.py",
    "scripts/Python/add_missing_string_references.py",
    "scripts/Python/add_runtime_heap_block.py",
    "scripts/Python/analyze_crt_functions.py",
