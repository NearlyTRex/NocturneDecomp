# The Python tooling: the Ghidra scripts and standalone tools in scripts/Python,
# plus cmake/collect_sources.py and recreation/cmake/tidy.py. Nothing here is a
# package; the project table exists because CI installs the checkout with
# `pip install -e .` before running the tests. The release version lives in
# CMakeLists.txt.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nocturne-decomp-tools"
version = "0"
requires-python = ">=3.12"

[tool.setuptools]
packages = []

[tool.testrex]
# The meta suite and the hermetic seal, from pytest-testrex; see tests/README.md
tests_dir = "tests"
min_test_files = 1
# integration/ joins when the first test against a real headless Ghidra lands
suites = ["unit"]
integration_suites = []
pylint_rcfile = "tests/pylintrc"
# Run the Ghidra scripts against a real headless Ghidra; see tests/conftest.py
requirement_markers = ["requires_ghidra"]
# Raise privileges, reach another machine, or publish
sealed_programs = [
    "sudo", "su", "pkexec", "doas",
    "ssh", "scp", "sftp",
    "gh",
]
# The files not yet covered, which [tool.coverage.run] omit leaves out of the
# floor; any other omit pattern fails the meta suite. Shrinks with that list and
# [tool.ruff.lint.per-file-ignores], and unit/meta/test_uncovered_lists.py checks
# the three agree.
coverage_omit_allowed = [
    "scripts/Python/ghidra_annotations/annotations/pseudocode/analysis.py",
    "scripts/Python/ghidra_annotations/annotations/pseudocode/exporter.py",
    "scripts/Python/ghidra_annotations/annotations/pseudocode/functions.py",
    "scripts/Python/ghidra_annotations/annotations/pseudocode/globals.py",
    "scripts/Python/ghidra_annotations/annotations/pseudocode/headers.py",
    "scripts/Python/ghidra_annotations/annotations/pseudocode/suspects/content.py",
]

[tool.coverage.run]
branch = true
source = ["scripts/Python", "cmake", "recreation/cmake"]
# The tests run in pytest-xdist workers, each writing its own data file
parallel = true
patch = ["subprocess"]
# Not yet covered. Each file leaves this list when its tests land, and the same
# file leaves [tool.ruff.lint.per-file-ignores] and [tool.testrex]
# coverage_omit_allowed with it; the meta suite checks the three lists agree. The
# list only shrinks.
omit = [
    "scripts/Python/ghidra_annotations/annotations/pseudocode/analysis.py",
    "scripts/Python/ghidra_annotations/annotations/pseudocode/exporter.py",
    "scripts/Python/ghidra_annotations/annotations/pseudocode/functions.py",
    "scripts/Python/ghidra_annotations/annotations/pseudocode/globals.py",
    "scripts/Python/ghidra_annotations/annotations/pseudocode/headers.py",
    "scripts/Python/ghidra_annotations/annotations/pseudocode/suspects/content.py",
]

[tool.coverage.report]
skip_covered = true

[tool.ruff]
# research/ holds the scripts behind its write-ups, kept as they were run
extend-exclude = ["research", "build", "headers"]
# What Ghidra's Script Manager puts in a menu script's globals
builtins = ["currentProgram", "currentAddress", "currentSelection", "getSourceFile"]

[tool.ruff.lint]
# The Workflows library's default set, pinned here so a library change is a
# deliberate change in this repo
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Not yet cleaned up; mirrors [tool.coverage.run] omit, and shrinks with it
"scripts/Python/ghidra_annotations/annotations/pseudocode/analysis.py" = ["E", "F"]
"scripts/Python/ghidra_annotations/annotations/pseudocode/exporter.py" = ["E", "F"]
"scripts/Python/ghidra_annotations/annotations/pseudocode/functions.py" = ["E", "F"]
"scripts/Python/ghidra_annotations/annotations/pseudocode/globals.py" = ["E", "F"]
"scripts/Python/ghidra_annotations/annotations/pseudocode/headers.py" = ["E", "F"]
"scripts/Python/ghidra_annotations/annotations/pseudocode/suspects/content.py" = ["E", "F"]
