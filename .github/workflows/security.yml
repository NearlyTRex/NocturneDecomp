name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    uses: NearlyTRex/Workflows/.github/workflows/security.yml@189a9c599b51396d09f95469f00b561da645ded1 # v0.2.7
    permissions:
      contents: read

  codeql:
    name: CodeQL
    uses: NearlyTRex/Workflows/.github/workflows/codeql.yml@189a9c599b51396d09f95469f00b561da645ded1 # v0.2.7
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      languages: '["actions"]'

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    uses: NearlyTRex/Workflows/.github/workflows/dependency-review.yml@189a9c599b51396d09f95469f00b561da645ded1 # v0.2.7
    permissions:
      contents: read
