name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    uses: NearlyTRex/Workflows/.github/workflows/security.yml@d3438cd6128cd821327a5b1708c300354bc0e20d # v0.2.5
    permissions:
      contents: read

  codeql:
    name: CodeQL
    uses: NearlyTRex/Workflows/.github/workflows/codeql.yml@d3438cd6128cd821327a5b1708c300354bc0e20d # v0.2.5
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      languages: '["c-cpp", "actions"]'

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    uses: NearlyTRex/Workflows/.github/workflows/dependency-review.yml@d3438cd6128cd821327a5b1708c300354bc0e20d # v0.2.5
    permissions:
      contents: read
