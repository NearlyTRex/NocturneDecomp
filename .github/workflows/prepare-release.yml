name: Prepare Release

# Bumps the version and opens a PR. Merging it lets release.yml tag and publish.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: patch, minor, major, or an exact version like 1.4.0
        required: true
        default: patch

permissions: {}

jobs:
  prepare:
    name: Prepare
    uses: NearlyTRex/Workflows/.github/workflows/prepare-release.yml@d90e5632677c483bafde340d821d3b1f070196b9 # v0.2.28
    permissions:
      contents: write
      pull-requests: write
    with:
      runs-on: ubuntu-26.04
      bump: ${{ inputs.bump }}
      version-file: CMakeLists.txt
