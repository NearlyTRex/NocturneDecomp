name: Prepare Release

# Bumps the version and opens a PR. Merging it lets release.yml tag and publish.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: patch, minor, major, or an exact version like 1.4.0
        required: true
        default: patch

permissions: {}

jobs:
  prepare:
    name: Prepare
    uses: NearlyTRex/Workflows/.github/workflows/prepare-release.yml@c84a2b6b942e42cf3f1c88119762f20cac536e3c # v0.2.22
    permissions:
      contents: write
      pull-requests: write
    with:
      bump: ${{ inputs.bump }}
      version-file: CMakeLists.txt
