name: Prepare Release

# Bumps the version and opens a PR. Merging it lets release.yml tag and publish.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: patch, minor, major, or an exact version like 1.4.0
        required: true
        default: patch

permissions: {}

jobs:
  prepare:
    name: Prepare
    uses: NearlyTRex/Workflows/.github/workflows/prepare-release.yml@4fe68c91984dd09dea6988fd603b128bc3f44ff7 # v0.2.9
    permissions:
      contents: write
      pull-requests: write
    with:
      bump: ${{ inputs.bump }}
      version-file: CMakeLists.txt
