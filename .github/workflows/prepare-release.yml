name: Prepare Release

# Bumps the version and opens a PR. Merging it lets release.yml tag and publish.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: patch, minor, major, or an exact version like 1.4.0
        required: true
        default: patch

permissions: {}

jobs:
  prepare:
    name: Prepare
    uses: NearlyTRex/Workflows/.github/workflows/prepare-release.yml@c7ccdd2026ee4f8c9a9eb46226b9f2767842d568 # v0.2.30
    permissions:
      contents: write
      pull-requests: write
    with:
      runs-on: ubuntu-26.04
      bump: ${{ inputs.bump }}
      version-file: CMakeLists.txt
