name: Release

# Tags the version in CMakeLists.txt once, builds every lane at that version, and
# attaches the archives to a draft release. The draft is published by hand, so a
# bad build can be discarded without an announcement going out. Pushes that don't
# change the version find the tag already there, and build nothing.
#
# To release: Actions -> Prepare Release -> Run workflow, then merge its PR.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    name: Check
    uses: NearlyTRex/Workflows/.github/workflows/lint.yml@32d5879909bb8344868510909ec6476ed6d49afd # v0.2.23
    permissions:
      contents: read
    with:
      markdown: false
      # Format is checked in the builds; see ci.yml.
      clang-format: false

  pending:
    name: Pending
    uses: NearlyTRex/Workflows/.github/workflows/release-check.yml@32d5879909bb8344868510909ec6476ed6d49afd # v0.2.23
    permissions:
      contents: read
    with:
      version-file: CMakeLists.txt

  package:
    name: Package (${{ matrix.preset }})
    needs: pending
    if: needs.pending.outputs.pending == 'true'
    uses: NearlyTRex/Workflows/.github/workflows/cpp-build.yml@32d5879909bb8344868510909ec6476ed6d49afd # v0.2.23
    permissions:
      contents: read
    strategy:
      # Every lane runs to completion: if the Windows cross build breaks, the
      # Linux archive is still worth having and the log says which half failed.
      fail-fast: false
      matrix:
        # SDL compiles its X11/Wayland/audio backends only when their headers
        # are present; bundledlibs.cmake fails the configure without them. The
        # exe-linux-x86_64 preset runs clang-tidy over the shims.
        include:
          - preset: exe-linux-x86_64
            packages: >-
              clang-tidy
              libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev
              libxrandr-dev libxss-dev libwayland-dev libxkbcommon-dev
              wayland-protocols libegl-dev libdecor-0-dev libpulse-dev
              libasound2-dev
          - preset: exe-windows-x86_64
            packages: g++-mingw-w64-x86-64 lld
          - preset: exe-linux-vanilla-x86_64
            packages: >-
              libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev
              libxrandr-dev libxss-dev libwayland-dev libxkbcommon-dev
              wayland-protocols libegl-dev libdecor-0-dev libpulse-dev
              libasound2-dev
          - preset: exe-windows-vanilla-x86_64
            packages: g++-mingw-w64-x86-64 lld
          - preset: exe-linux-aarch64
            os: ubuntu-24.04-arm
            packages: >-
              libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev
              libxrandr-dev libxss-dev libwayland-dev libxkbcommon-dev
              wayland-protocols libegl-dev libdecor-0-dev libpulse-dev
              libasound2-dev
          - preset: exe-linux-vanilla-aarch64
            os: ubuntu-24.04-arm
            packages: >-
              libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev
              libxrandr-dev libxss-dev libwayland-dev libxkbcommon-dev
              wayland-protocols libegl-dev libdecor-0-dev libpulse-dev
              libasound2-dev
          # The apt list is skipped off Linux; Xcode's clang and CMake are on
          # the runner already.
          - preset: exe-macos-x86_64
            os: macos-latest
          - preset: exe-macos-vanilla-x86_64
            os: macos-latest
          - preset: exe-macos-arm64
            os: macos-latest
          - preset: exe-macos-vanilla-arm64
            os: macos-latest
    with:
      runs-on: ${{ matrix.os || 'ubuntu-latest' }}
      apt-packages: cmake clang ninja-build pkg-config python3 zip ${{ matrix.packages }}
      brew-packages: ninja
      # git describe needs the tags and enough history to count commits against
      # them; a shallow checkout reports a bare hash.
      fetch-depth: 0
      cache-paths: |
        build/${{ matrix.preset }}/_deps
        build/${{ matrix.preset }}/ffmpeg
      cache-key-files: |
        cmake/bundledlibs.cmake
        cmake/ffmpeg.cmake
      # About 7,400 translation units: ccache recompiles only the ones a
      # commit touched, instead of all of them on every run.
      ccache: true
      # One build fills 500M, so ccache evicted as it went and kept only the tail.
      ccache-max-size: 2G
      # Shared by the CI build and the release build of the same preset.
      cache-key: ${{ matrix.preset }}
      # The Release job tags this commit only after the builds, so tag it here
      # too (locally, never pushed), or git describe stamps a bare hash into the
      # binary instead of the release it is.
      local-tag: ${{ needs.pending.outputs.tag }}
      build-command: ./scripts/Bash/package_release.sh "${{ matrix.preset }}"
      artifact: nocturne-${{ matrix.preset }}
      artifact-path: dist/*

  release:
    name: Release
    needs: [check, package]
    uses: NearlyTRex/Workflows/.github/workflows/release.yml@32d5879909bb8344868510909ec6476ed6d49afd # v0.2.23
    permissions:
      contents: write
    with:
      version-file: CMakeLists.txt
      draft: true
      assets: nocturne-*
      checksums: true
      # Placed above the generated notes: what each archive is, and that the
      # game data is not included.
      notes-file: .github/release-notes.md
