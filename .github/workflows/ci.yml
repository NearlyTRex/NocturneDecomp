name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The native lane, with the unit tests. The Windows lanes cross-compile to PEs
  # that cannot run here, so they are built only on release.
  build:
    name: Build (exe-linux-x86_64)
    uses: NearlyTRex/Workflows/.github/workflows/cpp-build.yml@189a9c599b51396d09f95469f00b561da645ded1 # v0.2.7
    permissions:
      contents: read
    with:
      # The -dev headers let SDL compile its X11/Wayland/audio backends;
      # bundledlibs.cmake fails the configure without them.
      apt-packages: >-
        cmake clang ninja-build pkg-config python3
        libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev
        libxrandr-dev libxss-dev libwayland-dev libxkbcommon-dev
        wayland-protocols libegl-dev libdecor-0-dev libpulse-dev
        libasound2-dev
      # SDL2 and SDL2_ttf are fetched from git and FFmpeg is built from source,
      # so a cold build is most of the wall clock. The pinned tags in
      # bundledlibs.cmake decide when the cache is stale.
      cache-paths: |
        build/exe-linux-x86_64/_deps
        build/exe-linux-x86_64/ffmpeg
      cache-key-files: cmake/bundledlibs.cmake
      # About 7,400 translation units: ccache recompiles only the ones a
      # commit touched, instead of all of them on every run.
      ccache: true
      # Shared by the CI build and the release build of the same preset.
      cache-key: exe-linux-x86_64
      # The test binaries are EXCLUDE_FROM_ALL, and ctest only runs what is
      # already built, so they are built explicitly (see docs/testing.md).
      build-command: |
        cmake --preset exe-linux-x86_64
        cmake --build --preset exe-linux-x86_64
        cmake --build build/exe-linux-x86_64 --target nocturne_tests
      test-command: ctest --test-dir build/exe-linux-x86_64 --output-on-failure

  lint:
    name: Lint
    uses: NearlyTRex/Workflows/.github/workflows/lint.yml@189a9c599b51396d09f95469f00b561da645ded1 # v0.2.7
    permissions:
      contents: read
    with:
      # The research notes predate the Markdown rules and would need thousands
      # of formatting-only edits. Code-fence checking goes with it; turn both on
      # once the notes are cleaned up.
      markdown: false
